<!DOCTYPE html>
    <html lang="en">

        <head>
            <meta charset="UTF-8">
            <title>QuizGame</title>
            <link rel="stylesheet" href="style/style.css">
        </head>

        <body class="bodyQuiz">

            <div class="quiz-container">
                <header>
                <div class="container">
                    <h1>My Personal Space</h1>

                    <nav> <!--Navegation-->
                        <a href="index.html">Home</a>
                        <a href="about.html">About</a>
                        <a href="contact.html">Contact</a>
                        <a href="quiz.html">Quiz!</a>
                    </nav>
                </div>
                </header>

                <h1>QuizGame</h1>

                <section class="categories">
                    <div id="A" class="category hoverEffect">A</div>
                    <div id="B" class="category hoverEffect">B</div>
                    <div id="C" class="category hoverEffect">C</div>
                </section>

                <main>
                    <div id="content">
                        <h2 id="question">Text with the question</h2>

                        <div class="answers">

                        <button class="answer">
                            <span class="letter hoverEffect">A</span>
                            <span id="optionA" class="text">First Option</span>
                        </button>
                        <button class="answer">
                            <span class="letter hoverEffect">B</span>
                            <span id="optionB" class="text">Second Option</span>
                        </button>
                        <button class="answer">
                            <span class="letter hoverEffect">C</span>
                            <span id="optionC" class="text">Third Option</span>
                        </button>
                        <button class="answer">
                            <span class="letter hoverEffect">D</span>
                            <span id="optionD" class="text">Fourth Option</span>
                        </button>
                        </div>

                    </div>
                    <div id="result">
                        <h2>Fim de jogo :D</h2>
                        <p class="pontos"></p>
                    </div>
                </main>
                <footer>
                <p>𖦹 Jackii's Heart</p>
                </footer>
                <script type="module" src="assets/advanced.js"></script>
            </div>

        </body>

    </html>
